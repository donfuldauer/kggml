# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"

reviews:
  # Every ready pull request gets an automatic review; drafts are skipped until marked ready.
  # `@coderabbitai review` asks for another pass. Milestone and phase-gate audits stay with the `phase-reviewer` agent.
  auto_review:
    enabled: true
    drafts: false
  poem: false
  collapse_walkthrough: true
  path_instructions:
    - path: "**/*.kt"
      instructions: |
        Enforce Kotlin Multiplatform engineering rules for `com.donfuldauer.kggml`:
        1. No global engine singletons; inference engines must be instantiable `AutoCloseable` classes with a dedicated single-thread `CoroutineDispatcher` serializing `init`, `infer`, and `close`.
        2. Verify cooperative coroutine cancellation propagates cleanly into native abort callbacks (`abort_callback`, `llama_set_abort_callback`, etc.).
        3. Verify `BackendConfig` (`CPU_ONLY`, `GPU_METAL`, `GPU_VULKAN`, `GPU_OPENCL`, `NPU_COREML`) is respected at runtime without compile-time-only locks, especially `use_gpu = false` on iOS for Whisper.
        4. Check for zero-copy buffer crossing (`usePinned` on Kotlin/Native, direct `ByteBuffer` / `GetPrimitiveArrayCritical` on JNI) and absence of temporary WAV/image disk I/O in streaming pipelines.
        5. Ensure pure Kotlin logic has deterministic `commonTest` unit coverage.
    - path: "**/CMakeLists.txt"
      instructions: |
        Verify strict binary modularity and single-symbol linkage:
        1. All `ggml-base`, `ggml-cpu` and `ggml-metal` targets must be centralized exclusively in `:kggml-runtime`. The optional GPU add-ons (`:kggml-runtime-vulkan`, `:kggml-runtime-opencl`) build only their `GGML_BACKEND_DL` backend module against the runtime's `libggml-base` and must not carry a ggml core of their own.
        2. Engine libraries (`:kggml-whisper`, `:kggml-llama`, `:kggml-diffusion`) must link dynamically against `:kggml-runtime` and never statically embed duplicate `ggml` objects.
        3. Confirm cross-compilation flags for Android (`arm64-v8a`, `x86_64`), Apple (`ios-arm64`, `ios-arm64-simulator` and `macos-arm64` XCFramework slices), and JVM desktop (`macos-aarch64`, `linux-x86_64`, `linux-aarch64`, `windows-x86_64`, `windows-aarch64`).
        4. The version comes from `kggml-runtime/native/cmake/kggml-version.cmake` (`VERSION_NAME` in `gradle.properties`); no project may hard-code its own.
    - path: "**/*.{c,cc,cpp,h,hpp,mm}"
      instructions: |
        Audit C++/Objective-C++ native bridges for memory safety and FFI soundness:
        1. Every FFI entry point must be wrapped in `extern "C"` with `try/catch` returning structured error codes—no C++ exceptions may cross JNI or Kotlin/Native boundaries.
        2. Verify zero-copy pointer lifetimes: `GetPrimitiveArrayCritical` must always be paired with `ReleasePrimitiveArrayCritical` on every return path without calling back into JNI while critical regions are held.
        3. Verify all native allocations (`whisper_context`, `whisper_state`, `llama_context`, `sd_ctx_t`, resampler buffers) are deterministically freed in `close()`/destructors with no leaks on error or cancellation paths.
        4. Check short-buffer guardrails (>= 1,000 ms floor for `whisper_full_with_state`) and thread-safe atomic abort flags.
    - path: "**/*.def"
      instructions: |
        Verify Kotlin/Native `cinterop` definitions expose only public C ABI headers, link dynamically against `GgmlRuntime.xcframework` where appropriate, and avoid symbol collisions across modules.

chat:
  auto_reply: false
