# Dependabot version and security updates (security updates are enabled in the repository settings).
#
# Covered:
#   - gradle: every version in gradle/libs.versions.toml (shared by the root build and build-logic) and the Gradle
#     wrapper. A wrapper update must also update the "Gradle Wrapper" row of NOTICE.
#   - github-actions: the actions used by .github/workflows/.
# Not covered, on purpose:
#   - The upstream C/C++ libraries (ggml, whisper.cpp, llama.cpp, stable-diffusion.cpp) are git submodules pinned in
#     CMakeLists.txt and NOTICE and checked by scripts/ci/verify-*-pin.sh. They have to move together (every engine
#     builds against the runtime's ggml), so they are updated by hand, not by a bot.
#
# Updates that must move together are grouped, so one PR builds and tests them as a set: the Kotlin compiler, the
# Compose compiler plugin and Compose Multiplatform are released for specific Kotlin versions, and Compose
# Multiplatform fixes the Jetpack Compose (androidx.compose) version used on Android.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    labels:
      - dependencies
      - infra:ci
    groups:
      kotlin-and-compose:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx:kotlinx-coroutines*"
          - "org.jetbrains.kotlinx.kover*"
          - "org.jetbrains.kotlinx:kover*"
          - "org.jetbrains.compose*"
          - "androidx.compose*"
      android-gradle-plugin:
        patterns:
          - "com.android.tools.build*"
          - "com.android.application"
          - "com.android.library"
      androidx-and-test:
        patterns:
          - "androidx.*"
          - "org.robolectric*"
          - "junit:junit"
      # Security updates are grouped separately (groups without `applies-to` cover version updates only).
      kotlin-and-compose-security:
        applies-to: security-updates
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx:kotlinx-coroutines*"
          - "org.jetbrains.kotlinx.kover*"
          - "org.jetbrains.kotlinx:kover*"
          - "org.jetbrains.compose*"
          - "androidx.compose*"
      gradle-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Android Gradle Plugin 9 changes how Kotlin Multiplatform Android targets are configured (the new KMP Android
      # library plugin), and Compose 1.12 (Multiplatform and Jetpack) needs AGP 9.1+ and compileSdk 37. That migration
      # is planned work (issue #109), not a dependency bump; remove these entries with it.
      - dependency-name: "org.jetbrains.compose*"
        versions: [">= 1.9.0"]
      - dependency-name: "androidx.compose*"
        versions: [">= 1.9.0"]
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.library"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    labels:
      - dependencies
      - infra:ci
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
