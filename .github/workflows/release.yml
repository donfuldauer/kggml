name: Release (Maven Central)

# Builds, signs, audits and uploads every Kggml coordinate under com.donfuldauer to Maven Central (issue #23):
#   kggml-bom, kggml-core-api, kggml-runtime, kggml-runtime-vulkan, kggml-runtime-opencl, kggml-whisper, kggml-llama, kggml-diffusion, kggml-model-manager
# (each Kotlin Multiplatform library with its android, jvm, iosArm64 and iosSimulatorArm64 components).
#
#   desktop-natives  ubuntu-latest + windows-latest build the release ggml runtime for linux-x86_64,
#                    windows-x86_64 and (cross-compiled, issue #91) linux-aarch64 and windows-aarch64, and stage it as
#                    JVM resources (kggml/native/<platform>/).
#   publish          macos-latest (the only host that builds every KMP target) builds the iOS xcframeworks, then
#                    scripts/ci/stage-release.sh publishes every publication signed into build/kggml-staging-repo
#                    with the macOS + Android runtimes bundled and the two desktop runtimes above added to the
#                    kggml-runtime jar, audits it (scripts/ci/verify_release.py) and zips the Central bundle.
#                    A real release then uploads it with scripts/ci/upload-central-bundle.sh.
#
# Triggers:
#   - push of a tag `v<VERSION_NAME>` (e.g. v1.0.0): real release. The tag must match gradle.properties.
#   - manual dispatch: dry run by default (sign with the configured key, or a throwaway key if none, audit, keep
#     the bundle as a workflow artifact, upload nothing). A non-dry-run dispatch must target a `v*` tag.
# Secrets (Settings -> Secrets and variables -> Actions; see docs/RELEASING.md):
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD  Central Portal user token
#   SIGNING_KEY / SIGNING_KEY_PASSWORD               ASCII-armored PGP secret key and its passphrase
#   SIGNING_KEY_ID                                   optional: the (sub)key id to sign with
# Never runs on pull requests: PR CI runs the same staging + audit as a dry run (ci.yml).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build, sign and audit the bundle without uploading it"
        type: boolean
        default: true
      publishing_type:
        description: "USER_MANAGED: Central validates, the owner presses Publish in the portal. AUTOMATIC: publish after validation (permanent)."
        type: choice
        options: [USER_MANAGED, AUTOMATIC]
        default: USER_MANAGED

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  desktop-natives:
    name: Desktop runtime (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-latest
            platform: linux-aarch64
          - os: windows-latest
            platform: windows-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository (with first-level submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Runner setup (Linux; installs missing build tools)
        if: runner.os == 'Linux'
        run: ./scripts/ci/setup/linux.sh ${{ matrix.platform == 'linux-aarch64' && '--arm64-cross' || '' }}

      - name: Runner setup (Windows; installs missing build tools, ARM64 + clang for windows-aarch64)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/setup/windows.ps1 ${{ matrix.platform == 'windows-aarch64' && '-Arm64' || '' }}

      - name: Set up MSVC developer environment (Windows)
        if: matrix.platform == 'windows-x86_64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Windows: build in cmd so MSVC wins over Git Bash's `link`, exactly as ci.yml does; Gradle then only stages.
      - name: Release runtime build (Windows arm64, LLVM clang)
        if: matrix.platform == 'windows-aarch64'
        shell: cmd
        timeout-minutes: 30
        run: |
          call kggml-runtime\native\scripts\build-windows-arm64.cmd build\native-release-install

      - name: Release runtime build (Windows, MSVC)
        if: matrix.platform == 'windows-x86_64'
        shell: cmd
        timeout-minutes: 30
        run: |
          cmake -S kggml-runtime/native --preset windows-x64 -B build/native-release -DKGGML_RUNTIME_BUILD_TESTS=OFF || exit /b 1
          cmake --build build/native-release --config Release -j 4 || exit /b 1
          cmake --install build/native-release --config Release --prefix build/native-release-install

      - name: Stage the runtime as JVM resources
        timeout-minutes: 30
        run: |
          skip=()
          [[ "${RUNNER_OS}" == Windows ]] && skip=(-x :kggml-runtime:buildNativeHostRelease)
          ./gradlew :kggml-runtime:stageJvmNativeResources --console=plain "${skip[@]}" \
            -Pkggml.nativePlatform=${{ matrix.platform }}
          index="kggml-runtime/build/generated/kggml-native/jvm/kggml/native/${{ matrix.platform }}/index.txt"
          test -f "${index}" || { echo "missing ${index}" >&2; exit 1; }
          cat "${index}"
          source scripts/ci/python.sh && kggml_require_python 3.9
          kggml_python scripts/ci/check_native_arch.py kggml-runtime/build/generated/kggml-native/jvm ${{ matrix.platform }}

      - name: Upload staged runtime
        uses: actions/upload-artifact@v4
        with:
          name: jvm-natives-${{ matrix.platform }}
          path: kggml-runtime/build/generated/kggml-native/jvm/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Stage, sign, audit and ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'keep (dry run)' || 'upload' }}
    needs: desktop-natives
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write   # draft GitHub release with the iOS xcframeworks (real releases only)
    steps:
      - name: Refuse a real release from anything but a v* tag
        if: env.DRY_RUN != 'true' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "A real release must run on a v<VERSION_NAME> tag (got ${GITHUB_REF}); dispatch with dry_run for branches." >&2
          exit 1

      - name: Checkout repository (with first-level submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Runner setup (installs missing build tools)
        run: ./scripts/ci/setup/macos.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download the desktop runtimes
        uses: actions/download-artifact@v4
        with:
          pattern: jvm-natives-*
          merge-multiple: true
          path: build/release-natives

      - name: Build the iOS xcframeworks (GgmlRuntime, KggmlWhisper, KggmlLlama, KggmlDiffusion)
        timeout-minutes: 60
        run: |
          ./kggml-runtime/native/scripts/build-ios-xcframework.sh
          ./kggml-whisper/native/scripts/build-ios-xcframework.sh
          ./kggml-llama/native/scripts/build-ios-xcframework.sh
          ./kggml-diffusion/native/scripts/build-ios-xcframework.sh

      - name: Stage, sign and audit every coordinate (all targets)
        timeout-minutes: 60
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME}}"
          args=()
          [[ "${DRY_RUN}" == true ]] && args+=(--dry-run)
          [[ "${GITHUB_REF}" == refs/tags/v* ]] && args+=(--expect-version "${GITHUB_REF_NAME#v}")
          ./scripts/ci/stage-release.sh "${args[@]}" -- \
            -Pkggml.bundleNative=true -Pkggml.extraJvmNativeResources="${GITHUB_WORKSPACE}/build/release-natives"

      - name: Check the kggml-runtime jar ships every desktop runtime
        run: |
          version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          jar="build/kggml-staging-repo/com/donfuldauer/kggml-runtime-jvm/${version}/kggml-runtime-jvm-${version}.jar"
          for platform in linux-x86_64 linux-aarch64 windows-x86_64 windows-aarch64 macos-aarch64; do
            unzip -l "${jar}" "kggml/native/${platform}/index.txt" >/dev/null \
              || { echo "kggml-runtime-jvm jar is missing kggml/native/${platform}/" >&2; exit 1; }
          done
          unzip -l "${jar}" 'kggml/native/*'
          # Every bundled library matches its platform directory (ELF / PE / Mach-O machine type; issue #91).
          tmp="$(mktemp -d)"
          unzip -q "${jar}" 'kggml/native/*' -d "${tmp}"
          python3 scripts/ci/check_native_arch.py "${tmp}"

      - name: Zip the iOS xcframeworks
        run: |
          mkdir -p build/release-ios
          for fw in GgmlRuntime KggmlWhisper KggmlLlama KggmlDiffusion; do
            (cd build/native-ios && ditto -c -k --keepParent "${fw}.xcframework" "../release-ios/${fw}.xcframework.zip")
          done
          (cd build/release-ios && shasum -a 256 *.zip > SHA256SUMS)

      - name: Keep the bundle and xcframeworks
        uses: actions/upload-artifact@v4
        with:
          name: kggml-release-${{ github.sha }}
          path: |
            build/kggml-central-bundle.zip
            build/release-ios/
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Maven Central
        if: env.DRY_RUN != 'true'
        timeout-minutes: 40
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: >
          ./scripts/ci/upload-central-bundle.sh build/kggml-central-bundle.zip
          "kggml ${GITHUB_REF_NAME}" "${{ github.event_name == 'workflow_dispatch' && inputs.publishing_type || 'USER_MANAGED' }}"

      - name: Draft a GitHub release with the iOS xcframeworks
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --title "Kggml ${GITHUB_REF_NAME}"
          --notes "Maven Central: com.donfuldauer:kggml-bom:${GITHUB_REF_NAME#v}. iOS xcframeworks attached (see SHA256SUMS)."
          build/release-ios/*.zip build/release-ios/SHA256SUMS
