name: Kggml Upstream & KMP/SPM Drift Audit

on:
  schedule:
    # Runs every Monday and Thursday at 09:00 UTC (04:00 EST)
    - cron: '0 9 * * 1,4'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Optional upstream ggml/whisper.cpp tag or SHA to compare against'
        required: false
        default: ''
      create_fix_pr:
        description: 'Create a draft PR with proposed KMP/SPM/sample fixes when drift is detected'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: kggml-drift-audit
  cancel-in-progress: true

jobs:
  audit-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kggml repository (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
          submodules: recursive

      - name: Gather upstream & KMP/SPM context
        run: |
          mkdir -p .audit-tmp

          git submodule status > .audit-tmp/submodules.txt 2>/dev/null || echo "No submodules configured" > .audit-tmp/submodules.txt
          git log --since="14 days ago" --oneline > .audit-tmp/recent_commits.txt

          find . -maxdepth 6 \
            \( -name "Package.swift" -o -name "*.def" -o -name "*whisper*.kt" -o -name "*ggml*.kt" -o -name "*Backend*.kt" -o -path "*/samples/*" \) \
            -not -path '*/.*' -not -path '*/build/*' > .audit-tmp/api_surface_files.txt

          if [ -s .audit-tmp/submodules.txt ] && ! grep -q "No submodules" .audit-tmp/submodules.txt; then
            git submodule foreach --quiet '
              echo "=== Submodule: $name ($sm_path) ==="
              git fetch --tags --quiet origin 2>/dev/null || true
              LOCAL_SHA=$(git rev-parse HEAD)
              REMOTE_SHA=$(git rev-parse origin/HEAD 2>/dev/null || git rev-parse origin/master 2>/dev/null || echo "unknown")
              echo "Pinned: $LOCAL_SHA | Upstream HEAD: $REMOTE_SHA"
              if [ "$LOCAL_SHA" != "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "unknown" ]; then
                git log --oneline "$LOCAL_SHA..$REMOTE_SHA" | head -n 40
              fi
            ' > .audit-tmp/upstream_delta.txt
          else
            echo "No git submodules found; inspect CMakeLists.txt, gradle/libs.versions.toml, or vendor scripts." > .audit-tmp/upstream_delta.txt
          fi

      - name: Exchange GitHub OIDC Token for Anthropic WIF Token
        id: wif
        env:
          FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          SERVICE_ACCOUNT_ID: svac_01YWPGGmSSQzsDvxSvxprN5y
          WORKSPACE_ID: wrkspc_01BszhTkQCM1Gj4TDefVSCfh
        run: |
          OIDC_JWT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r '.value')

          TOKEN_RESPONSE=$(curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data "$(jq -n \
              --arg assertion "$OIDC_JWT" \
              --arg rule "$FEDERATION_RULE_ID" \
              --arg org "$ORGANIZATION_ID" \
              --arg sa "$SERVICE_ACCOUNT_ID" \
              --arg ws "$WORKSPACE_ID" \
              '{
                grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
                assertion: $assertion,
                federation_rule_id: $rule,
                organization_id: $org,
                service_account_id: $sa,
                workspace_id: $ws
              }')")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token // empty')
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "WIF token exchange failed: $TOKEN_RESPONSE" >&2
            exit 1
          fi
          echo "::add-mask::$ACCESS_TOKEN"
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run Direct Messages API Drift Audit (Prompt Cached)
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ steps.wif.outputs.access_token }}
          UPSTREAM_REF: ${{ github.event.inputs.upstream_ref }}
        run: |
          python3 -m pip install --quiet anthropic
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import anthropic

          def read_safe(path, limit=25000):
              p = pathlib.Path(path)
              if not p.exists():
                  return ""
              return p.read_text(errors="replace")[:limit]

          surface_list = [
              line.strip()
              for line in read_safe(".audit-tmp/api_surface_files.txt").splitlines()
              if line.strip()
          ][:40]

          surface_blobs = []
          for rel in surface_list:
              content = read_safe(rel, limit=8000)
              if content:
                  surface_blobs.append(f"### FILE: {rel}\n```\n{content}\n```")

          static_context = f"""You are auditing the Kggml Kotlin Multiplatform repository (com.donfuldauer.kggml).

          === SUBMODULES ===
          {read_safe(".audit-tmp/submodules.txt")}

          === UPSTREAM DELTA ===
          {read_safe(".audit-tmp/upstream_delta.txt")}

          === RECENT COMMITS ===
          {read_safe(".audit-tmp/recent_commits.txt")}

          === GRADLE VERSIONS ===
          {read_safe("gradle/libs.versions.toml", limit=12000)}

          === KMP / SPM / SAMPLE API SURFACE ===
          {chr(10).join(surface_blobs)}
          """

          dynamic_task = f"""Upstream Ref Override: {os.environ.get("UPSTREAM_REF") or "(none)"}

          Return ONLY valid JSON with this exact schema:
          {{
            "audit_report_markdown": "Markdown report with sections: ## Executive Summary, ## Upstream ggml / whisper.cpp Delta, ## KMP & SPM API Surface Drift, ## Proposed Fixes Summary, ## Recommended Action Items",
            "kmp_spm_drift_detected": true or false,
            "file_edits": [
              {{
                "path": "relative/path/to/file",
                "content": "full updated file content"
              }}
            ]
          }}
          Rules:
          - Only propose file_edits for KMP, SPM (Package.swift / .def), or sample API drift—never modify submodules.
          - If no KMP/SPM/sample edits are needed, set kmp_spm_drift_detected to false and file_edits to [].
          """

          client = anthropic.Anthropic(auth_token=os.environ["ANTHROPIC_AUTH_TOKEN"])
          msg = client.messages.create(
              model="claude-opus-4-6",
              max_tokens=8192,
              messages=[
                  {
                      "role": "user",
                      "content": [
                          {
                              "type": "text",
                              "text": static_context,
                              "cache_control": {"type": "ephemeral"},
                          },
                          {
                              "type": "text",
                              "text": dynamic_task,
                          },
                      ],
                  }
              ],
          )

          print("Usage:", msg.usage)

          raw = "".join(block.text for block in msg.content if block.type == "text").strip()
          if raw.startswith("```"):
              raw = raw.split("\n", 1)[1].rsplit("```", 1)[0].strip()

          data = json.loads(raw)
          pathlib.Path(".audit-tmp/audit-report.md").write_text(data["audit_report_markdown"])

          drift = bool(data.get("kmp_spm_drift_detected")) and bool(data.get("file_edits"))
          for edit in data.get("file_edits", []):
              target = pathlib.Path(edit["path"])
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(edit["content"])

          pathlib.Path(".audit-tmp/drift_status.env").write_text(
              f"kmp_spm_drift_detected={'true' if drift else 'false'}\n"
          )
          PY

      - name: Open or Update GitHub Tracking Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f .audit-tmp/audit-report.md ]; then
            echo "No audit report generated; skipping issue update."
            exit 0
          fi

          gh label create "drift-audit" --color "5319E7" --description "Automated upstream & KMP/SPM drift report" --force

          ISSUE_TITLE="Kggml Automated Drift Audit (ggml/Whisper & KMP/SPM)"
          EXISTING_ISSUE=$(gh issue list --label "drift-audit" --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue edit "$EXISTING_ISSUE" --body-file .audit-tmp/audit-report.md
            gh issue comment "$EXISTING_ISSUE" --body "Automated audit refreshed on $(date -u +'%Y-%m-%d %H:%M UTC')."
          else
            gh issue create \
              --title "$ISSUE_TITLE" \
              --label "drift-audit" \
              --body-file .audit-tmp/audit-report.md
          fi

      - name: Create Draft PR for KMP / SPM / Sample Drift Fixes
        if: ${{ github.event.inputs.create_fix_pr != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KGGML_COAUTHOR: "Don Fuldauer <13605136+donfuldauer@users.noreply.github.com>"
        run: |
          [ -f .audit-tmp/drift_status.env ] && source .audit-tmp/drift_status.env
          rm -rf .audit-tmp

          if [ "${kmp_spm_drift_detected:-false}" != "true" ] || [ -z "$(git status --porcelain)" ]; then
            echo "No KMP/SPM/sample drift fixes to commit; skipping draft PR."
            exit 0
          fi

          ./scripts/install-git-hooks.sh || true

          BRANCH_NAME="chore/kggml-kmp-spm-drift-fix"
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"

          git checkout -B "$BRANCH_NAME"
          git add -A
          git commit -m "chore(kggml): align KMP, SPM, and sample APIs with current surface"
          git push --force-with-lease origin "$BRANCH_NAME"

          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq '.[0].number')
          PR_BODY="Automated draft PR generated from the Kggml drift audit workflow to resolve detected KMP, Swift Package Manager (SPM), or sample app API mismatches. Please review diffs and run KMP/iOS/sample test suites before marking ready for review."

          if [ -n "$EXISTING_PR" ]; then
            gh pr comment "$EXISTING_PR" --body "Updated proposed fixes on $(date -u +'%Y-%m-%d %H:%M UTC')."
          else
            gh pr create \
              --draft \
              --base main \
              --head "$BRANCH_NAME" \
              --title "chore(kggml): fix KMP/SPM/sample API drift" \
              --body "$PR_BODY"
          fi
