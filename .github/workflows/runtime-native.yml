name: Runtime Native (Linux + Android)

# Manual dispatch only. Every check here (ggml/whisper/llama/stable-diffusion.cpp pins, host build + CTest, linkage audits,
# jvmTest, Android cross-compile + audits) also runs in the Ubuntu job of ci.yml on every ready PR,
# so running this workflow per PR billed the same Linux work twice. Keep it for an isolated rerun of
# the native gate (Actions tab -> Run workflow). Locally: ./scripts/ci-local.sh --only pin,native,jvm,android

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-native-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  host:
    name: Host build + CTest (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository (with ggml submodule)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: host-linux

      - name: Verify ggml submodule matches the pin recorded in CMakeLists.txt and NOTICE
        run: ./scripts/ci/verify-ggml-pin.sh

      - name: Configure, build and test (build/native)
        run: ./kggml-runtime/native/scripts/build-host.sh

      - name: Audit dynamic ggml linkage
        run: ./scripts/ci/audit-host-linkage.sh

      - name: Verify whisper.cpp submodule matches the pin recorded in CMakeLists.txt and NOTICE
        run: ./scripts/ci/verify-whisper-pin.sh

      - name: Whisper engine build + CTest (build/native-whisper)
        run: ./kggml-whisper/native/scripts/build-host.sh

      - name: Audit libkggml_whisper links the runtime ggml dynamically (no embedded ggml)
        run: ./scripts/ci/audit-whisper-linkage.sh host

      - name: Verify llama.cpp submodule matches the pin recorded in CMakeLists.txt and NOTICE
        run: ./scripts/ci/verify-llama-pin.sh

      - name: Llama engine (llama.cpp + libmtmd) build + CTest (build/native-llama)
        run: ./kggml-llama/native/scripts/build-host.sh

      - name: Audit libkggml_llama links the runtime ggml dynamically (no embedded ggml)
        run: ./scripts/ci/audit-llama-linkage.sh host

      - name: Verify stable-diffusion.cpp submodule matches the pin recorded in CMakeLists.txt and NOTICE
        run: ./scripts/ci/verify-diffusion-pin.sh

      - name: Diffusion engine (stable-diffusion.cpp) build + CTest (build/native-diffusion)
        run: ./kggml-diffusion/native/scripts/build-host.sh

      - name: Audit libkggml_diffusion links the runtime ggml dynamically (no embedded ggml)
        run: ./scripts/ci/audit-diffusion-linkage.sh host

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Kotlin JNI bindings against the native runtime + whisper (jvmTest)
        run: ./gradlew :kggml-runtime:jvmTest :kggml-whisper:jvmTest -Pkggml.requireNative=true --console=plain

      - name: Upload CTest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-ubuntu-latest
          path: |
            build/native/Testing/Temporary/
            build/native-whisper/Testing/Temporary/
            build/native-llama/Testing/Temporary/
            build/native-diffusion/Testing/Temporary/
          if-no-files-found: ignore

  android:
    name: Android cross-compile (arm64-v8a, x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository (with ggml submodule)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android

      - name: Build Android shared libraries
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME}}"
          ./kggml-runtime/native/scripts/build-android.sh arm64-v8a x86_64

      - name: Audit unversioned sonames and dynamic ggml linkage
        run: ./scripts/ci/audit-android-linkage.sh arm64-v8a x86_64

      - name: Build Android libkggml_whisper.so
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME}}"
          ./kggml-whisper/native/scripts/build-android.sh arm64-v8a x86_64

      - name: Audit libkggml_whisper.so (unversioned soname, dynamic ggml, no test hooks)
        run: ./scripts/ci/audit-whisper-linkage.sh android arm64-v8a x86_64

      - name: Build Android libkggml_llama.so
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME}}"
          ./kggml-llama/native/scripts/build-android.sh arm64-v8a x86_64

      - name: Audit libkggml_llama.so (unversioned soname, dynamic ggml, no test hooks)
        run: ./scripts/ci/audit-llama-linkage.sh android arm64-v8a x86_64

      - name: Build Android libkggml_diffusion.so
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME}}"
          ./kggml-diffusion/native/scripts/build-android.sh arm64-v8a x86_64

      - name: Audit libkggml_diffusion.so (unversioned soname, dynamic ggml, no test hooks)
        run: ./scripts/ci/audit-diffusion-linkage.sh android arm64-v8a x86_64
