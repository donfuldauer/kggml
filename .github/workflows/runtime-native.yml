name: Runtime Native (Linux + Android)

# Linux-only PR gate (1x billed minutes). The macOS job lives in runtime-native-macos.yml and runs
# only on demand (`ci:macos` label / manual dispatch) or on the weekly schedule, because hosted
# macOS minutes are billed at 10x on private repositories.
# Every step here is reproducible locally with ./scripts/ci-local.sh.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "kggml-runtime/**"
      - "kggml-core-api/src/commonMain/**"
      - "build-logic/**"
      - "gradle/**"
      - "gradle.properties"
      - ".gitmodules"
      - "NOTICE"
      - "scripts/ci/**"
      - ".github/workflows/runtime-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-native-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  host:
    name: Host build + CTest (ubuntu-latest)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository (with ggml submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: host-linux

      - name: Verify ggml submodule matches the pin recorded in CMakeLists.txt and NOTICE
        run: ./scripts/ci/verify-ggml-pin.sh

      - name: Configure, build and test (build/native)
        run: ./kggml-runtime/native/scripts/build-host.sh

      - name: Audit dynamic ggml linkage
        run: ./scripts/ci/audit-host-linkage.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Kotlin JNI bindings against the native runtime (jvmTest)
        run: ./gradlew :kggml-runtime:jvmTest -Pkggml.requireNative=true --console=plain

      - name: Upload CTest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-ubuntu-latest
          path: build/native/Testing/Temporary/
          if-no-files-found: ignore

  android:
    name: Android cross-compile (arm64-v8a, x86_64)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository (with ggml submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android

      - name: Build Android shared libraries
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME}}"
          ./kggml-runtime/native/scripts/build-android.sh arm64-v8a x86_64

      - name: Audit unversioned sonames and dynamic ggml linkage
        run: ./scripts/ci/audit-android-linkage.sh arm64-v8a x86_64
