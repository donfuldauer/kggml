name: Runtime Native (macOS)

# Hosted macOS minutes are billed at 10x on private repositories, so this job never runs on every
# PR push. It runs only when:
#   - a PR carries the `ci:macos` label (required on phase-final PRs and on PRs that change
#     macOS/iOS-specific native code, Metal, CoreML, cinterop or xcframework packaging);
#   - it is dispatched manually (Actions tab -> Run workflow, any branch);
#   - the weekly schedule fires AND main changed runtime paths in the past 7 days.

on:
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Adding an unrelated label must not cancel an in-progress macOS run, so such events get their
  # own throwaway group; everything else on the same ref supersedes the previous run.
  group: runtime-native-macos-${{ github.ref }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'ci:macos') && github.run_id || 'build' }}
  cancel-in-progress: true

jobs:
  gate:
    name: Decide whether macOS should run
    # Skipped jobs are not billed: unlabelled PR pushes stop here without starting any runner.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:macos')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout repository (scheduled runs only)
        if: github.event_name == 'schedule'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          HAS_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:macos') }}
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          run=false
          case "${EVENT}" in
            workflow_dispatch) run=true ;;
            pull_request)
              if [[ "${DRAFT}" == "true" || "${HAS_LABEL}" != "true" ]]; then
                run=false
              elif [[ "${ACTION}" == "labeled" ]]; then
                # Only the ci:macos label itself starts a run, not unrelated labels on a labelled PR.
                [[ "${LABEL}" == "ci:macos" ]] && run=true
              else
                run=true
              fi ;;
            schedule)
              changes="$(git log --since='7 days ago' --format=%H -- \
                kggml-runtime kggml-core-api/src/commonMain build-logic gradle gradle.properties \
                .gitmodules NOTICE scripts/ci .github/workflows/runtime-native-macos.yml)"
              [[ -n "${changes}" ]] && run=true ;;
          esac
          echo "event=${EVENT} action=${ACTION} label=${LABEL} has_label=${HAS_LABEL} draft=${DRAFT} -> run=${run}"
          echo "run=${run}" >> "${GITHUB_OUTPUT}"

  host:
    name: Host build + CTest (macos-latest)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Checkout repository (with ggml submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja || true

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: host-macos

      - name: Verify ggml submodule matches the pin recorded in CMakeLists.txt and NOTICE
        run: ./scripts/ci/verify-ggml-pin.sh

      - name: Configure, build and test (build/native)
        run: ./kggml-runtime/native/scripts/build-host.sh

      - name: Audit dynamic ggml linkage
        run: ./scripts/ci/audit-host-linkage.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Kotlin JNI bindings against the native runtime (jvmTest)
        run: ./gradlew :kggml-runtime:jvmTest -Pkggml.requireNative=true --console=plain

      - name: Upload CTest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-macos-latest
          path: build/native/Testing/Temporary/
          if-no-files-found: ignore
