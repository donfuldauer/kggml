name: CI (Phase 1 cross-platform matrix)

# Every ready pull request runs all three platform jobs on GitHub-hosted runners:
#   - Ubuntu:  Linux x86_64 native runtime + whisper (whisper.cpp) + llama (llama.cpp + libmtmd) + diffusion
#              (stable-diffusion.cpp) + CTest + ggml / upstream pins + host linkage audits, the linux-aarch64 cross
#              build with CTest under qemu, `./gradlew check` (commonTest, jvmTest, testAndroidHostTest, BOM checks, sample
#              audits) with native-backed tests mandatory (incl. the :integration-tests dual-engine coexistence suite:
#              whisper + llama inferring concurrently in one JVM on the single shared ggml runtime, plus diffusion),
#              Android NDK cross-compile + linkage audits, the GPU add-on builds and the desktop Vulkan test on
#              lavapipe, whisper-only-minimal release APK binary symbol audit, Android APKs + desktop jar for both
#              samples, and the Maven Central release dry-run (scripts/ci/stage-release.sh, as release.yml runs it).
#   - macOS:   macOS arm64 native runtime (Metal + Accelerate) + whisper + llama + diffusion + CTest, JVM tests,
#              GgmlRuntime/KggmlWhisper.xcframework (CoreML) + KggmlLlama.xcframework + KggmlDiffusion.xcframework,
#              iosSimulatorArm64Test and macosArm64Test, sample iOS frameworks + whisper-only-minimal iOS symbol
#              audit, both samples' Xcode apps (simulator + device, unsigned), release dry-run with the iOS components.
#   - Windows: Windows x64 native runtime + whisper + llama + diffusion (MSVC) + CTest, JVM tests against it, and
#              the windows-arm64 cross build.
# Android instrumented suites need an emulator and are run by hand (scripts/ci/run-android-instrumented.sh).
# Checkouts fetch first-level submodules only (`submodules: true`): stable-diffusion.cpp's own nested submodules
# (its ggml copy, libwebp, libwebm, web UI) are never built, and none of the other upstreams has nested ones.
# Not run: draft PRs, docs/agent-instruction-only PRs (paths-ignore below), and pushes to main (PRs
# merge with a merge commit after this workflow passed on the PR head, so a main run repeats it).
# Every job and slow step has a timeout, so a check always ends (AGENTS.md "When a runner fails or hangs").
# Every Ubuntu step is reproducible locally with `./scripts/ci-local.sh --full`.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".agents/**"
      - ".claude/**"
      - ".gemini/**"
      - ".antigravity/**"
      - ".codex/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  # The native runtime is built explicitly by a dedicated step on every runner, so Gradle must not rebuild it
  # (its Exec task shells out to bash, which on Windows may resolve to WSL). -Pkggml.requireNative=true then
  # turns every native-backed test from "skip if missing" into "fail if missing".
  NATIVE_GRADLE_ARGS: -Pkggml.requireNative=true -x :kggml-runtime:buildNativeHost -x :kggml-whisper:buildNativeHost -x :kggml-llama:buildNativeHost -x :kggml-diffusion:buildNativeHost --console=plain

jobs:
  linux:
    name: Ubuntu (Linux JVM, Android, CTest)
    # Draft PRs start no runner; marking the PR ready runs it.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # llama.cpp + libmtmd and stable-diffusion.cpp (host + 2 Android ABIs each) more than double the cold native
    # compile time; ccache keeps warm runs well below this.
    timeout-minutes: 110
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Checkout repository (with ggml submodule)
        uses: actions/checkout@v4
        with:
          submodules: true

      # Everything the job needs (Ninja, CMake, the aarch64 cross toolchain, qemu-user), installed when missing.
      - name: Runner setup (installs missing build tools)
        run: ./scripts/ci/setup/linux.sh --arm64-cross

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ci-linux

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Native runtime (linux-x64) build + CTest + ggml pin + dynamic linkage audit
        run: |
          ./scripts/ci/verify-ggml-pin.sh
          ./kggml-runtime/native/scripts/build-host.sh
          ./scripts/ci/audit-host-linkage.sh

      # Issue #91: the JVM jar also ships linux-aarch64. Cross-compiled here (no arm64 Linux runner); CTest runs the
      # aarch64 test binaries under qemu-user, and the release staging path is checked for the right ELF machine.
      - name: Native runtime (linux-aarch64 cross, CTest under qemu-aarch64) + linkage audit + staged arch check
        run: |
          ./kggml-runtime/native/scripts/build-host.sh --target linux-aarch64
          READELF=aarch64-linux-gnu-readelf NM=aarch64-linux-gnu-nm \
            ./scripts/ci/audit-host-linkage.sh build/native-linux-aarch64/lib
          ./gradlew :kggml-runtime:stageJvmNativeResources -Pkggml.nativePlatform=linux-aarch64 --console=plain
          python3 scripts/ci/check_native_arch.py kggml-runtime/build/generated/kggml-native/jvm linux-aarch64

      - name: Native whisper (linux-x64) build + CTest + dynamic ggml linkage audit
        run: |
          ./scripts/ci/verify-whisper-pin.sh
          ./kggml-whisper/native/scripts/build-host.sh
          ./scripts/ci/audit-whisper-linkage.sh host

      - name: Native llama (llama.cpp + libmtmd, linux-x64) build + CTest + dynamic ggml linkage audit
        run: |
          ./scripts/ci/verify-llama-pin.sh
          ./kggml-llama/native/scripts/build-host.sh
          ./scripts/ci/audit-llama-linkage.sh host

      - name: Native diffusion (stable-diffusion.cpp, linux-x64) build + CTest + dynamic ggml linkage audit
        run: |
          ./scripts/ci/verify-diffusion-pin.sh
          ./kggml-diffusion/native/scripts/build-host.sh
          ./scripts/ci/audit-diffusion-linkage.sh host

      - name: Gradle check (commonTest, jvmTest, testAndroidHostTest, dual-engine coexistence, showcase UI tests, BOM) with native tests required
        run: ./gradlew check $NATIVE_GRADLE_ARGS

      # Same script as release.yml: every publication signed (throwaway key), then POM/.module/BOM, sources/javadoc,
      # checksum and gpg signature audit. iOS components are built only on macOS (see the macOS job).
      - name: Release dry-run (signed Maven Central staging + audit, JVM/Android/metadata)
        timeout-minutes: 20
        run: ./scripts/ci/stage-release.sh --dry-run --skip-targets ios,macos -- $NATIVE_GRADLE_ARGS

      - name: Android NDK cross-compile (arm64-v8a, x86_64) incl. the Vulkan and OpenCL GPU add-ons
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME}}"
          ./kggml-runtime/native/scripts/build-android.sh arm64-v8a x86_64
          ./scripts/ci/audit-android-linkage.sh arm64-v8a x86_64
          ./kggml-whisper/native/scripts/build-android.sh arm64-v8a x86_64
          ./scripts/ci/audit-whisper-linkage.sh android arm64-v8a x86_64
          ./kggml-llama/native/scripts/build-android.sh arm64-v8a x86_64
          ./scripts/ci/audit-llama-linkage.sh android arm64-v8a x86_64
          ./kggml-diffusion/native/scripts/build-android.sh arm64-v8a x86_64
          ./scripts/ci/audit-diffusion-linkage.sh android arm64-v8a x86_64
          # Android GPU add-on (kggml-runtime-vulkan): ggml's Vulkan backend module against the runtime's ggml.
          ./kggml-runtime-vulkan/native/scripts/build-android.sh arm64-v8a x86_64
          ./scripts/ci/audit-gpu-addon.sh vulkan arm64-v8a x86_64
          # Android OpenCL add-on (kggml-runtime-opencl): ggml's OpenCL backend module (Adreno kernels).
          ./kggml-runtime-opencl/native/scripts/build-android.sh arm64-v8a x86_64
          ./scripts/ci/audit-gpu-addon.sh opencl arm64-v8a x86_64

      # Issue #92: the JVM desktop Vulkan add-on (kggml-runtime-vulkan's jar module), built against the runtime's ggml and
      # registered by the JVM loader. Mesa's lavapipe is a software Vulkan device, so the runtime must report Vulkan
      # available and AUTO must resolve to it (GGML_VK_VISIBLE_DEVICES=0 lets ggml use a CPU-type device).
      - name: Desktop Vulkan add-on (linux-x86_64 module) + JVM runtime test on Mesa lavapipe
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME}}"
          ./scripts/ci/setup/linux.sh --vulkan
          ./kggml-runtime-vulkan/native/scripts/build-host.sh
          ./scripts/ci/audit-gpu-addon.sh vulkan --desktop linux-x86_64
          report=kggml-runtime/build/test-results/jvmTest/TEST-com.donfuldauer.kggml.runtime.JvmNativeRuntimeTest.xml
          ./gradlew :kggml-runtime:jvmTest --tests '*JvmNativeRuntimeTest*' $NATIVE_GRADLE_ARGS \
            -Pkggml.test.vulkanAddonDir=build/native-vulkan-jvm/kggml/native-addons/linux-x86_64/ggml-vulkan \
            || { grep -A8 '<failure' "${report}" >&2 || true; exit 1; }
          grep -q 'testcase name="theDesktopVulkanAddonRegistersWhenConfigured' "${report}"
          ! grep -A1 'testcase name="theDesktopVulkanAddonRegistersWhenConfigured' "${report}" | grep -q '<skipped' \
            || { echo "the Vulkan add-on test was skipped" >&2; exit 1; }

      - name: whisper-only-minimal binary symbol audit (release APK + desktop app, zero llama / stable-diffusion symbols)
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME}}"
          ./scripts/ci/audit-minimal-sample.sh android
          # Desktop: the app jar + runtime classpath, and the linux-x64 host native libraries it loads (ELF).
          ./scripts/ci/audit-minimal-sample.sh desktop

      - name: Assemble samples (Android APKs, desktop jar) via kggml-bom
        run: >
          ./gradlew --console=plain
          :samples:kggml-showcase:androidApp:assembleDebug
          :samples:kggml-showcase:desktopJar
          :samples:whisper-only-minimal:androidApp:assembleDebug

      - name: Print JVM crash reports on failure
        if: failure()
        shell: bash
        run: |
          find . -name 'hs_err_pid*.log' -not -path './.git/*' -print0 | while IFS= read -r -d '' f; do
            echo "::group::${f}"; sed -n '1,150p' "${f}"; echo '--- native libraries:'; grep -E '\.so|\.dylib|\.dll' "${f}" | grep -v '^Event' | head -150; echo "::endgroup::"
          done

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-linux
          path: |
            build/native/Testing/Temporary/
            build/native-whisper/Testing/Temporary/
            build/native-llama/Testing/Temporary/
            build/native-diffusion/Testing/Temporary/
            **/build/reports/
            **/hs_err_pid*.log
          if-no-files-found: ignore

  macos:
    name: macOS (macOS JVM, iOS XCFramework + simulator tests, CTest)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: macos-latest
    # Every step below has its own timeout so a hang fails in minutes with a named step instead of holding the
    # PR (and the agent waiting on it) for hours; the job cap is only a backstop. Agents treat a timed-out or
    # runner-lost job per AGENTS.md "When a runner fails or hangs".
    timeout-minutes: 140
    steps:
      - name: Checkout repository (with ggml submodule)
        uses: actions/checkout@v4
        with:
          submodules: true

      # Ninja and CMake when missing (Homebrew, as the runner user); checks Xcode and an iOS simulator runtime.
      - name: Runner setup (installs missing build tools)
        run: ./scripts/ci/setup/macos.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Native runtime (macos-arm64, Metal + Accelerate) build + CTest + ggml pin + dynamic linkage audit
        timeout-minutes: 20
        run: |
          ./scripts/ci/verify-ggml-pin.sh
          ./kggml-runtime/native/scripts/build-host.sh
          ./scripts/ci/audit-host-linkage.sh

      - name: Native whisper (macos-arm64) build + CTest + dynamic ggml linkage audit
        timeout-minutes: 20
        run: |
          ./kggml-whisper/native/scripts/build-host.sh
          ./scripts/ci/audit-whisper-linkage.sh host

      - name: Native llama (macos-arm64) build + CTest + dynamic ggml linkage audit
        timeout-minutes: 25
        run: |
          ./kggml-llama/native/scripts/build-host.sh
          ./scripts/ci/audit-llama-linkage.sh host

      - name: Native diffusion (macos-arm64) build + CTest + dynamic ggml linkage audit
        timeout-minutes: 25
        run: |
          ./kggml-diffusion/native/scripts/build-host.sh
          ./scripts/ci/audit-diffusion-linkage.sh host

      - name: Build GgmlRuntime.xcframework (iosArm64 + iosSimulatorArm64 + macosArm64)
        timeout-minutes: 20
        run: ./kggml-runtime/native/scripts/build-ios-xcframework.sh

      # Issue #93: Kotlin/Native macOS (core-api and runtime so far) against the framework's macos-arm64 slice, natively.
      - name: Kotlin/Native macOS tests (macosArm64Test, core-api + runtime, real GgmlRuntime.framework)
        timeout-minutes: 20
        run: ./gradlew :kggml-core-api:macosArm64Test :kggml-runtime:macosArm64Test $NATIVE_GRADLE_ARGS

      - name: Build KggmlWhisper.xcframework (iosArm64 + iosSimulatorArm64, CoreML, linked to GgmlRuntime)
        timeout-minutes: 20
        run: ./kggml-whisper/native/scripts/build-ios-xcframework.sh

      - name: Build KggmlLlama.xcframework (iosArm64 + iosSimulatorArm64, llama.cpp + libmtmd, linked to GgmlRuntime)
        timeout-minutes: 20
        run: ./kggml-llama/native/scripts/build-ios-xcframework.sh

      - name: Build KggmlDiffusion.xcframework (iosArm64 + iosSimulatorArm64, stable-diffusion.cpp, linked to GgmlRuntime)
        timeout-minutes: 20
        run: ./kggml-diffusion/native/scripts/build-ios-xcframework.sh

      - name: Release dry-run (signed Maven Central staging + audit, every target incl. iOS klibs)
        timeout-minutes: 30
        run: ./scripts/ci/stage-release.sh --dry-run -- $NATIVE_GRADLE_ARGS

      - name: JVM tests (incl. dual-engine coexistence) against the macOS native runtime
        timeout-minutes: 20
        run: |
          ./gradlew jvmTest :samples:kggml-showcase:desktopTest :samples:whisper-only-minimal:desktopTest $NATIVE_GRADLE_ARGS
          ./scripts/ci/audit-minimal-sample.sh desktop $NATIVE_GRADLE_ARGS

      # A simulator left booted or wedged (e.g. by the image's own setup) can stall the test run, so start
      # from a clean slate.
      - name: Shut down leftover simulators
        timeout-minutes: 3
        run: xcrun simctl shutdown all || true

      - name: Pick an available iPhone simulator
        id: sim
        timeout-minutes: 2
        run: |
          udid="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), reverse=True)
          print(next(d["udid"] for k in ios for d in devices[k] if d["name"].startswith("iPhone")))
          ')"
          echo "Using simulator ${udid}"
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"

      # Each test task is also capped in Gradle (kggml.iosTestTimeoutMinutes, root build.gradle.kts) and logs
      # every test as it starts, so a hang names the module and test before this step's own timeout.
      - name: iOS simulator tests (iosSimulatorArm64Test)
        timeout-minutes: 30
        run: >
          ./gradlew iosSimulatorArm64Test $NATIVE_GRADLE_ARGS --continue
          -Pkggml.iosSimulatorDevice=${{ steps.sim.outputs.udid }}
          -Pkggml.iosTestTimeoutMinutes=12

      - name: Link iOS frameworks (SDK modules + samples, iosArm64 + iosSimulatorArm64)
        timeout-minutes: 20
        run: >
          ./gradlew --console=plain
          :kggml-runtime:compileKotlinIosArm64
          :kggml-whisper:compileKotlinIosArm64
          :samples:kggml-showcase:linkDebugFrameworkIosArm64
          :samples:kggml-showcase:linkDebugFrameworkIosSimulatorArm64
          :samples:whisper-only-minimal:linkDebugFrameworkIosArm64
          :samples:whisper-only-minimal:linkDebugFrameworkIosSimulatorArm64

      - name: whisper-only-minimal binary symbol audit (iOS framework + xcframework slices)
        timeout-minutes: 10
        run: ./scripts/ci/audit-minimal-sample.sh ios

      # The Xcode host apps of both samples (samples/*/iosApp), unsigned: they compile the Kotlin frameworks through
      # their own build phase and embed the xcframeworks built above, as a developer's Xcode build does.
      - name: Build the samples' iOS apps (simulator + device, unsigned)
        timeout-minutes: 20
        run: ./scripts/ios/build-sample-apps.sh all

      - name: Shut down simulators
        if: always()
        timeout-minutes: 3
        run: xcrun simctl shutdown all || true

      - name: Print JVM crash reports on failure
        if: failure()
        shell: bash
        run: |
          find . -name 'hs_err_pid*.log' -not -path './.git/*' -print0 | while IFS= read -r -d '' f; do
            echo "::group::${f}"; sed -n '1,150p' "${f}"; echo '--- native libraries:'; grep -E '\.so|\.dylib|\.dll' "${f}" | grep -v '^Event' | head -150; echo "::endgroup::"
          done

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-macos
          path: |
            build/native/Testing/Temporary/
            build/native-whisper/Testing/Temporary/
            build/native-llama/Testing/Temporary/
            build/native-diffusion/Testing/Temporary/
            **/build/reports/
            **/hs_err_pid*.log
          if-no-files-found: ignore

  windows:
    name: Windows (Windows x64 native, JVM, CTest)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository (with ggml submodule)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Everything the job needs (Visual Studio C++ x64 + ARM64 tools, clang, Ninja), installed when missing.
      - name: Runner setup (installs missing build tools)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/setup/windows.ps1 -Arm64

      - name: Set up MSVC developer environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Run in cmd so the MSVC toolchain (cl.exe, link.exe) wins over Git Bash's coreutils `link`.
      - name: Native runtime (windows-x64, MSVC) build + CTest
        shell: cmd
        run: |
          cmake -S kggml-runtime/native --preset windows-x64 -B build/native || exit /b 1
          cmake --build build/native --config Release -j 4 || exit /b 1
          ctest --test-dir build/native --build-config Release --output-on-failure -j 4

      - name: Native whisper (windows-x64, MSVC) build + CTest
        shell: cmd
        run: |
          cmake -S kggml-whisper/native --preset windows-x64 -B build/native-whisper || exit /b 1
          cmake --build build/native-whisper --config Release -j 4 || exit /b 1
          ctest --test-dir build/native-whisper --build-config Release --output-on-failure -j 4

      - name: Native llama (windows-x64, MSVC) build + CTest
        shell: cmd
        run: |
          cmake -S kggml-llama/native --preset windows-x64 -B build/native-llama || exit /b 1
          cmake --build build/native-llama --config Release -j 4 || exit /b 1
          ctest --test-dir build/native-llama --build-config Release --output-on-failure -j 4

      - name: Native diffusion (windows-x64, MSVC) build + CTest
        shell: cmd
        run: |
          cmake -S kggml-diffusion/native --preset windows-x64 -B build/native-diffusion || exit /b 1
          cmake --build build/native-diffusion --config Release -j 4 || exit /b 1
          ctest --test-dir build/native-diffusion --build-config Release --output-on-failure -j 4

      - name: JVM tests (incl. dual-engine coexistence) against the Windows native runtime
        run: |
          ./gradlew jvmTest :samples:kggml-showcase:desktopTest :samples:whisper-only-minimal:desktopTest $NATIVE_GRADLE_ARGS
          ./scripts/ci/audit-minimal-sample.sh desktop $NATIVE_GRADLE_ARGS

      # Issue #91: the JVM jar also ships windows-aarch64 (Windows on ARM). Cross-compiled with LLVM clang for the
      # MSVC ABI (ggml rejects cl.exe for ARM); there is no arm64 Windows runner to run it, so the staged DLLs are
      # checked for the ARM64 PE machine type instead.
      - name: Native runtime (windows-arm64 cross, LLVM clang) build
        shell: cmd
        run: call kggml-runtime\native\scripts\build-windows-arm64.cmd build\native-release-install

      - name: Stage the windows-aarch64 runtime + staged arch check
        run: |
          ./gradlew :kggml-runtime:stageJvmNativeResources -Pkggml.nativePlatform=windows-aarch64 \
            -x :kggml-runtime:buildNativeHostRelease --console=plain
          source scripts/ci/python.sh && kggml_require_python 3.9
          kggml_python scripts/ci/check_native_arch.py kggml-runtime/build/generated/kggml-native/jvm windows-aarch64

      - name: Print JVM crash reports on failure
        if: failure()
        shell: bash
        run: |
          find . -name 'hs_err_pid*.log' -not -path './.git/*' -print0 | while IFS= read -r -d '' f; do
            echo "::group::${f}"; sed -n '1,150p' "${f}"; echo '--- native libraries:'; grep -E '\.so|\.dylib|\.dll' "${f}" | grep -v '^Event' | head -150; echo "::endgroup::"
          done

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-windows
          path: |
            build/native/Testing/Temporary/
            build/native-whisper/Testing/Temporary/
            build/native-llama/Testing/Temporary/
            build/native-diffusion/Testing/Temporary/
            **/build/reports/
            **/hs_err_pid*.log
          if-no-files-found: ignore
