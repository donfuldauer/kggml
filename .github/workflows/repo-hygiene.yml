name: Repo Hygiene & Agent Parity

# Cheap Linux checks on every PR. Not re-run on pushes to main: PRs merge with a merge commit after
# these passed on the PR head. Every job runs on a GitHub-hosted runner.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # gitleaks-action lists PR commits via the REST API on pull_request events.
  pull-requests: read

jobs:
  agent-parity:
    name: Verify Multi-Harness Agent & Skill Parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify parity across AGENTS.md, .agents, .claude, .gemini, .antigravity, and .codex
        run: ./scripts/verify-agent-parity.sh

      - name: Test the agent CI waiter (scripts/ci/wait-pr-checks.sh)
        run: ./scripts/tests/test-wait-pr-checks.sh

      - name: Verify every workflow job runs on a GitHub-hosted runner
        run: ./scripts/ci/verify-hosted-runners.sh

      - name: Test the hosted-runner audit (scripts/ci/verify-hosted-runners.sh)
        run: ./scripts/tests/test-verify-hosted-runners.sh

      - name: Test the Maven Central release audit (scripts/ci/verify_release.py)
        run: ./scripts/tests/test-verify-release.sh

  license-audit:
    name: License, NOTICE & Fixture Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify LICENSE, upstream pins and test fixtures against NOTICE
        run: ./scripts/ci/verify-licenses.sh

      - name: Test the license audit (scripts/ci/verify-licenses.sh)
        run: ./scripts/tests/test-verify-licenses.sh

  docs-audit:
    name: Docs, Links, README Snippets & KDoc Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The README snippets themselves are compiled by `./gradlew check` (:docs-snippets) in ci.yml; this job checks
      # that README.md still matches them, so a Markdown-only change cannot drift from the compiled code.
      - name: Verify Markdown links, README snippets, Maven coordinates and public-API KDoc
        run: ./scripts/ci/verify-docs.sh

      - name: Test the docs audit (scripts/ci/verify-docs.sh)
        run: ./scripts/tests/test-verify-docs.sh

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action downloads to a fixed name in the temp dir and fails if it is already there; runner.temp
          # is emptied for every job.
          TMPDIR: ${{ runner.temp }}
