name: Repo Hygiene & Agent Parity

# Cheap Linux checks on every PR. Not re-run on pushes to main: PRs merge with a merge commit after
# these passed on the PR head. Every job runs on the owner's self-hosted Linux runner while LINUX_RUNNER is 'on'
# (same-repository PRs only), else on a GitHub-hosted runner (AGENTS.md "Runner order").
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # gitleaks-action lists PR commits via the REST API on pull_request events.
  pull-requests: read

jobs:
  agent-parity:
    name: Verify Multi-Harness Agent & Skill Parity
    runs-on: >-
      ${{ vars.LINUX_RUNNER == 'on' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && fromJSON('["self-hosted","Linux","X64","local-linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify parity across AGENTS.md, .agents, .claude, .gemini, .antigravity, and .codex
        run: ./scripts/verify-agent-parity.sh

      - name: Test the agent CI waiter (scripts/ci/wait-pr-checks.sh)
        run: ./scripts/tests/test-wait-pr-checks.sh

      # Fails if a job can reach an unapproved or fork-reachable runner, or any self-hosted runner while public (#63).
      - name: Verify where every workflow job runs (hosted, or approved fork-guarded self-hosted while private)
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
        run: ./scripts/ci/verify-hosted-runners.sh

      - name: Test the hosted-runner audit (scripts/ci/verify-hosted-runners.sh)
        run: ./scripts/tests/test-verify-hosted-runners.sh

      - name: Test the Maven Central release audit (scripts/ci/verify_release.py)
        run: ./scripts/tests/test-verify-release.sh

  license-audit:
    name: License, NOTICE & Fixture Audit
    runs-on: >-
      ${{ vars.LINUX_RUNNER == 'on' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && fromJSON('["self-hosted","Linux","X64","local-linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify LICENSE, upstream pins and test fixtures against NOTICE
        run: ./scripts/ci/verify-licenses.sh

      - name: Test the license audit (scripts/ci/verify-licenses.sh)
        run: ./scripts/tests/test-verify-licenses.sh

  docs-audit:
    name: Docs, Links, README Snippets & KDoc Audit
    runs-on: >-
      ${{ vars.LINUX_RUNNER == 'on' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && fromJSON('["self-hosted","Linux","X64","local-linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The README snippets themselves are compiled by `./gradlew check` (:docs-snippets) in ci.yml; this job checks
      # that README.md still matches them, so a Markdown-only change cannot drift from the compiled code.
      - name: Verify Markdown links, README snippets, Maven coordinates and public-API KDoc
        run: ./scripts/ci/verify-docs.sh

      - name: Test the docs audit (scripts/ci/verify-docs.sh)
        run: ./scripts/tests/test-verify-docs.sh

      - name: Test the full-history audit (scripts/ci/audit-history.sh)
        run: ./scripts/tests/test-audit-history.sh

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: >-
      ${{ vars.LINUX_RUNNER == 'on' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && fromJSON('["self-hosted","Linux","X64","local-linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action downloads to a fixed name in the temp dir and fails if it is already there; runner.temp
          # is emptied for every job.
          TMPDIR: ${{ runner.temp }}

      # gitleaks-action only scans the PR's own commits; this scans every commit of every branch (plus, on a manual
      # dispatch, every PR head): secrets, oversized blobs, credential files, unattributed binaries, private
      # keys, developer-machine paths.
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Own directory: gitleaks-action above downloads into runner.temp under a fixed name.
          dir="${RUNNER_TEMP}/gitleaks-history"
          mkdir -p "${dir}"
          curl -fsSL -o "${dir}/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${dir}/${tarball}" | sha256sum -c -
          tar -xzf "${dir}/${tarball}" -C "${dir}" gitleaks
          echo "${dir}" >>"${GITHUB_PATH}"

      # On a PR only the branches plus this PR's head (already checked out) are audited: PR heads stay on GitHub
      # read-only, so one bad fork PR must not fail every later PR. A manual dispatch audits them all.
      - name: Fetch every branch
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Fetch every pull-request head
        if: github.event_name != 'pull_request'
        run: git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/pull/*'

      - name: Audit the full git history
        run: ./scripts/ci/audit-history.sh
