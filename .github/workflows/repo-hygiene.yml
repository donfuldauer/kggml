name: Repo Hygiene & Agent Parity

# Cheap Linux checks on every PR. Not re-run on pushes to main: PRs merge with a merge commit after
# these passed on the PR head. Both jobs follow the same runner order as ci.yml (AGENTS.md "Runner order").
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # gitleaks-action lists PR commits via the REST API on pull_request events.
  pull-requests: read

jobs:
  agent-parity:
    name: Verify Multi-Harness Agent & Skill Parity
    runs-on: >-
      ${{ vars.MAC_RUNNER == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && fromJSON('["self-hosted","macOS","ARM64","local-mac"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify parity across AGENTS.md, .agents, .claude, .gemini, .antigravity, and .codex
        run: ./scripts/verify-agent-parity.sh

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: >-
      ${{ vars.MAC_RUNNER == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && fromJSON('["self-hosted","macOS","ARM64","local-mac"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action downloads to a fixed name in the temp dir and fails if it is already there; runner.temp
          # is emptied for every job, so this also works on a self-hosted runner.
          TMPDIR: ${{ runner.temp }}
