name: Repo Hygiene & Agent Parity

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  # gitleaks-action lists PR commits via the REST API on pull_request events.
  pull-requests: read

jobs:
  agent-parity:
    name: Verify Multi-Harness Agent & Skill Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify parity across AGENTS.md, .agents, .claude, .gemini, .antigravity, and .codex
        run: ./scripts/verify-agent-parity.sh

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
