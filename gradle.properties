# Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin
kotlin.code.style=official
# iOS/macOS targets are declared everywhere but only built on macOS hosts.
# Kotlin 2.4 enables klib cross-compilation by default, which causes modules without their own cinterop
# (e.g. :kggml-runtime-opencl, :kggml-runtime-vulkan) to fail generating Apple publication metadata on
# Linux/Windows after their :kggml-runtime cinterop dependency skips compilation.
kotlin.native.ignoreDisabledTargets=true
kotlin.native.enableKlibsCrossCompilation=false
# Shared iosMain code calls cinterop bindings (e.g. :kggml-runtime's kggml_runtime.h).
kotlin.mpp.enableCInteropCommonization=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kggml publishing coordinates & POM metadata (consumed by the `kggml.publishing` convention plugin)
GROUP=com.donfuldauer
VERSION_NAME=0.1.0
POM_URL=https://github.com/donfuldauer/kggml
POM_SCM_CONNECTION=scm:git:https://github.com/donfuldauer/kggml.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/donfuldauer/kggml.git
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_DEVELOPER_ID=donfuldauer
POM_DEVELOPER_NAME=Don Fuldauer
POM_DEVELOPER_URL=https://github.com/donfuldauer
